# Read by Larastan (composer types:check), which boots Testbench from this file.
# PHPUnit does not read it: tests/TestCase.php sets the auth model and providers itself.
env:
  AUTH_MODEL: NickDeKruijk\Leap\Tests\Fixtures\User

# Package discovery only covers the dependencies, not this package itself, so without
# this the leap:: views are unknown and every view('leap::...') is reported.
providers:
  - NickDeKruijk\Leap\ServiceProvider
